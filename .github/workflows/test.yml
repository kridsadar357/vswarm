name: test
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.0
      - name: Linux sandbox tools
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -q && sudo apt-get install -yq bubblewrap strace openssh-server zsh
          # Ubuntu 24.04 limits unprivileged user namespaces, which bubblewrap needs.
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
          sudo mkdir -p /run/sshd
      - run: bun install --frozen-lockfile
      - run: bunx tsc --noEmit
      - run: bun test
      - run: bun src/cli.ts selftest
      # Windows (phase 1): a real scan of the runner must end in PASS/WARN (0) or BLOCK (3), never a crash (4).
      - name: Windows scan smoke run
        if: runner.os == 'Windows'
        shell: bash
        run: |
          code=0
          bun src/cli.ts scan --offline || code=$?
          echo "exit $code"
          [ "$code" = 0 ] || [ "$code" = 3 ]
      # Windows (phase 2): install, the background watch as a real scheduled task, and uninstall, on the runner.
      - name: Windows install and watch
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $env:VSWARM_HOME = Join-Path $env:RUNNER_TEMP 'vswarm-home'
          $vs = Join-Path $env:VSWARM_HOME 'bin\vswarm.cmd'
          bun src/cli.ts install --yes; if ($LASTEXITCODE) { throw "install exit $LASTEXITCODE" }
          if (-not (Test-Path $vs)) { throw "no launcher at $vs" }
          bun src/cli.ts baseline --yes; if ($LASTEXITCODE) { throw "baseline exit $LASTEXITCODE" }
          bun src/cli.ts watch on --every 30; if ($LASTEXITCODE) { throw "watch on exit $LASTEXITCODE" }
          $t = Get-ScheduledTask -TaskPath '\vswarm\' -TaskName 'watch'
          "$($t.Actions[0].Execute) $($t.Actions[0].Arguments)"
          bun src/cli.ts watch run; if ($LASTEXITCODE) { throw "watch run exit $LASTEXITCODE" }
          # vswarm's own task is not a new scheduled task in the diff.
          $diff = (bun src/cli.ts diff) -join "`n"
          $diff
          if ($diff -match 'vswarm\\watch') { throw 'the scan reported vswarm''s own task' }
          bun src/cli.ts uninstall; if ($LASTEXITCODE) { throw "uninstall exit $LASTEXITCODE" }
          if (Get-ScheduledTask -TaskPath '\vswarm\' -TaskName 'watch' -ErrorAction SilentlyContinue) { throw 'uninstall left the task behind' }
          if (Test-Path $vs) { throw 'uninstall left the launcher behind' }
