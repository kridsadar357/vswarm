name: test
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.0
      - name: Linux sandbox tools
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -q && sudo apt-get install -yq bubblewrap strace openssh-server zsh
          # Ubuntu 24.04 limits unprivileged user namespaces, which bubblewrap needs.
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
          sudo mkdir -p /run/sshd
      - run: bun install --frozen-lockfile
      - run: bunx tsc --noEmit
      - run: bun test
      # The machine-check bench: every planted technique and benign look-alike, offline, in a fake home (a few seconds).
      # The package-name bench needs a 260 MB download and stays a manual script: bun scripts/bench-names.ts
      - name: Selftest (machine-check bench)
        run: bun src/cli.ts selftest
      # Windows (phase 1): a real scan of the runner must end in PASS/WARN (0) or BLOCK (3), never a crash (4).
      - name: Windows scan smoke run
        if: runner.os == 'Windows'
        shell: bash
        run: |
          code=0
          bun src/cli.ts scan --offline || code=$?
          echo "exit $code"
          [ "$code" = 0 ] || [ "$code" = 3 ]
      # Windows (phase 2) on the runner: install, the background watch as a real scheduled task, the ssh gate through
      # Windows OpenSSH, the install guard in a PowerShell profile, and uninstall. The data folder has a space in its
      # name on purpose: the gate's cmd.exe line has to escape it.
      - name: Windows install, watch, gate and guard
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $env:VSWARM_HOME = Join-Path $env:RUNNER_TEMP 'vswarm home'
          $vs = Join-Path $env:VSWARM_HOME 'bin\vswarm.cmd'
          # Commands that weaken protection ask a person; nobody is at this runner, so test\ci-person.ts answers.
          $cli = (Resolve-Path test\ci-person.ts).Path
          function vswarm { bun $cli @args; if ($LASTEXITCODE -and $LASTEXITCODE -ne 3) { throw "vswarm $args exit $LASTEXITCODE" } }
          function sshTry($h) { (cmd /c "ssh -o BatchMode=yes -o ConnectTimeout=3 $h true 2>&1") -join "`n" }
          # The runner's own background programs come and go (provjobd.exe from a temp folder, talking to GitHub): vswarm
          # rightly flags them. Accepted until a fresh check passes, so the steps below test vswarm, not the runner.
          function passNow { $ErrorActionPreference = 'Continue'; for ($i = 0; $i -lt 6; $i++) { bun $cli preflight --quiet --max-age 0 *> $null; if ($LASTEXITCODE -eq 0) { return }; bun $cli accept --all *> $null; Start-Sleep 2 }; throw 'preflight does not pass on this runner' }
          vswarm install --yes
          if (-not (Test-Path $vs)) { throw "no launcher at $vs" }
          vswarm baseline --yes

          "== watch"
          vswarm watch on --every 30
          $t = Get-ScheduledTask -TaskPath '\vswarm\' -TaskName 'watch'
          "$($t.Actions[0].Execute) $($t.Actions[0].Arguments)"
          vswarm watch run

          "== gate"
          vswarm gate ssh "probe-*"
          Get-Content (Join-Path $HOME '.ssh\config')
          $lock = Join-Path $env:VSWARM_HOME 'sec\lock'
          Set-Content -Path $lock -Value '{"incident":"ci","at":0,"reason":"CI"}'
          $o = sshTry 'probe-1'; $o
          if ($o -notmatch 'did not pass preflight') { throw 'the gate did not stop ssh while an incident was open' }
          $o = sshTry 'other-host'; $o
          if ($o -match 'vswarm') { throw 'the gate touched a host it does not guard' }
          Remove-Item $lock
          vswarm accept --all
          passNow
          $o = sshTry 'probe-1'; $o
          if ($o -match 'did not pass preflight' -or $o -notmatch 'resolve hostname') { throw 'the gate stopped ssh although preflight passes' }

          "== guard"
          vswarm guard on
          $docs = [Environment]::GetFolderPath('MyDocuments')
          $prof = Join-Path $docs 'WindowsPowerShell\profile.ps1'
          if (-not (Select-String -Path $prof -Pattern 'vswarm guard' -Quiet)) { throw "no guard in $prof" }
          $work = Join-Path $env:RUNNER_TEMP 'guard-work'; New-Item -ItemType Directory -Force $work | Out-Null
          Push-Location $work
          $o = (powershell -NoLogo -NonInteractive -Command "npm install axois; 'exit=' + `$LASTEXITCODE") -join "`n"; $o
          if ($o -notmatch 'exit=3' -or (Test-Path node_modules\axois)) { throw 'the guard let a look-alike package in' }
          $o = (powershell -NoLogo -NonInteractive -Command "npm --version; 'exit=' + `$LASTEXITCODE") -join "`n"; $o
          if ($o -notmatch 'exit=0') { throw 'the guard broke a command that installs nothing' }
          Pop-Location

          "== vswarm's own changes are not findings"
          $diff = (bun $cli diff) -join "`n"
          $diff
          foreach ($p in 'vswarm\\watch', 'profile\.ps1', '\.ssh\\config') { if ($diff -match $p) { throw "the scan reported vswarm's own $p" } }

          "== uninstall"
          vswarm uninstall
          if (Get-ScheduledTask -TaskPath '\vswarm\' -TaskName 'watch' -ErrorAction SilentlyContinue) { throw 'uninstall left the task behind' }
          if (Test-Path $vs) { throw 'uninstall left the launcher behind' }
          if (Select-String -Path $prof -Pattern 'vswarm guard' -Quiet) { throw 'uninstall left the guard behind' }
          $sshcfg = Join-Path $HOME '.ssh\config'
          if ((Test-Path $sshcfg) -and (Select-String -Path $sshcfg -Pattern 'vswarm gate' -Quiet)) { throw 'uninstall left the gate behind' }
      # vswarm agent on Windows, end to end, in the default data folder: its Task Scheduler task starts the agent
      # without the step's environment, so a VSWARM_HOME here would leave the task's agent on another pipe.
      - name: Windows agent
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          # Commands that weaken protection ask a person; nobody is at this runner, so test\ci-person.ts answers.
          $cli = (Resolve-Path test\ci-person.ts).Path
          function vswarm { bun $cli @args; if ($LASTEXITCODE -and $LASTEXITCODE -ne 3) { throw "vswarm $args exit $LASTEXITCODE" } }
          $lock = Join-Path $HOME '.vswarm\sec\lock'
          # The runner's own background programs come and go (provjobd.exe from a temp folder, talking to GitHub): vswarm
          # rightly flags them. Accepted until a fresh check passes, so the steps below test vswarm, not the runner.
          function passNow { $ErrorActionPreference = 'Continue'; for ($i = 0; $i -lt 6; $i++) { bun $cli preflight --quiet --max-age 0 *> $null; if ($LASTEXITCODE -eq 0) { return }; bun $cli accept --all *> $null; Start-Sleep 2 }; throw 'preflight does not pass on this runner' }
          vswarm install --no-path --yes
          vswarm baseline --yes
          vswarm accept --all
          passNow
          vswarm agent on "agent-*"
          $t = Get-ScheduledTask -TaskPath '\vswarm\' -TaskName 'agent'
          "$($t.Actions[0].Execute) $($t.Actions[0].Arguments)"
          $st = (bun $cli agent status 2>&1) -join "`n"; $st
          if ($st -notmatch 'agent running') { throw 'the agent task did not start the agent' }
          $pipe = [regex]::Match($st, '\\\\\.\\pipe\\vswarm-agent-[0-9a-f]+').Value
          if (-not $pipe) { throw 'agent status does not name the pipe' }
          $g = (ssh -G agent-1) -join "`n"
          if ($g -notmatch 'identityagent //\./pipe/vswarm-agent-') { throw "ssh does not send agent-1 to the agent" }
          $kd = Join-Path $env:RUNNER_TEMP 'agent-keys'; New-Item -ItemType Directory -Force $kd | Out-Null
          $k = Join-Path $kd 'ci_ed25519'
          ssh-keygen -q -t ed25519 -N '""' -C ci-agent -f $k
          $env:SSH_AUTH_SOCK = $pipe
          ssh-add $k
          Move-Item $k "$k.away"
          $l = (ssh-add -l) -join "`n"; $l
          if ($l -notmatch 'ci-agent') { throw 'the agent does not list the key it was given' }
          $msg = Join-Path $kd 'msg.txt'; Set-Content $msg 'deploy to production'
          passNow
          $ErrorActionPreference = 'Continue'
          ssh-keygen -Y sign -f "$k.pub" -n file $msg 2>&1 | Out-Host
          if ($LASTEXITCODE -ne 0 -or -not (Test-Path "$msg.sig")) { throw 'the agent did not sign while the machine passes' }
          Remove-Item "$msg.sig"
          Set-Content -Path $lock -Value '{"incident":"ci","at":0,"reason":"CI"}'
          ssh-keygen -Y sign -f "$k.pub" -n file $msg 2>&1 | Out-Host
          if ($LASTEXITCODE -eq 0 -or (Test-Path "$msg.sig")) { throw 'the agent signed while an incident was open' }
          $ErrorActionPreference = 'Stop'
          Remove-Item $lock
          Remove-Item Env:SSH_AUTH_SOCK
          $log = (bun $cli agent log 2>&1) -join "`n"; $log
          if ($log -notmatch 'refused') { throw 'the refusal is not in the audit log' }

          $diff = (bun $cli diff) -join "`n"
          if ($diff -match 'vswarm\\agent') { throw "the scan reported vswarm's own agent task" }
          vswarm uninstall
          if (Get-ScheduledTask -TaskPath '\vswarm\' -TaskName 'agent' -ErrorAction SilentlyContinue) { throw 'uninstall left the agent task behind' }
          # A config that held only vswarm's block is removed with it.
          $sshcfg = Join-Path $HOME '.ssh\config'
          if ((Test-Path $sshcfg) -and (Select-String -Path $sshcfg -Pattern 'vswarm agent' -Quiet)) { throw 'uninstall left the agent block behind' }
