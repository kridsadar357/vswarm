name: test
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.0
      - name: Linux sandbox tools
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -q && sudo apt-get install -yq bubblewrap strace openssh-server zsh
          # Ubuntu 24.04 limits unprivileged user namespaces, which bubblewrap needs.
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
          sudo mkdir -p /run/sshd
      - run: bun install --frozen-lockfile
      - run: bunx tsc --noEmit
      - run: bun test
      - run: bun src/cli.ts selftest
