name: False alarm
description: vswarm flagged something that is normal. We treat these as bugs.
labels: [false-alarm]
body:
  - type: markdown
    attributes:
      value: |
        Thanks. A tool that cries wolf gets uninstalled, so every false alarm matters.
        Check the output for anything private (host names, user names, paths) before you paste it.
  - type: textarea
    id: finding
    attributes:
      label: The finding
      description: Paste the finding from `vswarm scan --details` or `vswarm why <n>`.
      render: text
    validations:
      required: true
  - type: textarea
    id: why-normal
    attributes:
      label: Why it is normal
      description: What installed or changed it, and where it comes from (a package, an app, your own config).
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: vswarm version and OS
      placeholder: "vswarm 2.9.0, macOS 15.4 (vswarm --version)"
    validations:
      required: true
