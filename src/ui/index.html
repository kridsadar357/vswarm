<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<meta name="color-scheme" content="light dark">
<title>vswarm</title>
<link rel="icon" type="image/png" href="logo.png">
<link rel="stylesheet" href="app.css">
</head>
<body>
<a class="skip" href="#main" data-i18n="sec.findings">Things to look at</a>
<header class="top">
  <div class="top__in">
    <div class="brand">
      <img class="brand__mark" src="logo.png" alt="" width="32" height="32">
      <span class="brand__name">vswarm</span>
      <span class="brand__host" id="host"></span>
    </div>
    <div class="controls">
      <div class="seg" role="group" id="lang" aria-label="Language / ภาษา">
        <button type="button" data-lang="th" lang="th">ไทย</button>
        <button type="button" data-lang="en" lang="en">EN</button>
      </div>
      <button type="button" class="iconbtn" id="theme" aria-label="Theme"></button>
    </div>
  </div>
</header>
<div class="banner" id="banner" hidden></div>
<main id="main" class="wrap">
  <section class="verdict" id="hero" aria-live="polite">
    <p class="verdict__loading" data-i18n="app.loading">Reading this machine's state…</p>
  </section>
  <section id="findings" aria-labelledby="h-findings"></section>
  <div class="cols">
    <section id="tiles" aria-labelledby="h-tiles"></section>
    <section id="timeline" aria-labelledby="h-timeline"></section>
  </div>
  <details class="more">
    <summary data-i18n="more.title">Everything else</summary>
    <div class="more__in">
      <section id="terminal" aria-labelledby="h-terminal"></section>
      <section id="about" aria-labelledby="h-about"></section>
    </div>
  </details>
</main>
<footer class="foot wrap" id="foot"></footer>
<dialog class="dlg" id="dlg" aria-labelledby="dlg-title">
  <div class="dlg__in">
    <h2 id="dlg-title"></h2>
    <p id="dlg-body"></p>
    <div class="dlg__btns">
      <button type="button" class="btn btn--ghost" id="dlg-no"></button>
      <button type="button" class="btn btn--primary" id="dlg-yes"></button>
    </div>
  </div>
</dialog>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script src="app.js" defer></script>
</body>
</html>
